<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Contato</h1>

        <form id="formContato">
            <input type="text" id="nome" placeholder="Nome" maxlength="100" required>
            <input type="tel" id="telefone" placeholder="Telefone" maxlength="30" required>
            <input type="text" id="cidade" placeholder="Cidade" maxlength="100" required>
            <textarea id="descricao" placeholder="Descrição" maxlength="1000"></textarea>
            <input type="text" id="responsavel" placeholder="Nome do responsável" maxlength="100" required>
            <input type="tel" id="contatoResponsavel" placeholder="Contato do responsável" maxlength="30" required>
            <button type="submit">Enviar</button>
        </form>

        <p id="mensagem"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
